# fly.toml — Favorly API
#
# Deploy:
#   cd backend
#   fly launch --no-deploy --copy-config --name favorly-api
#   fly secrets set \
#     SUPABASE_URL=... \
#     SUPABASE_KEY=... \
#     SUPABASE_SERVICE_ROLE_KEY=... \
#     DATABASE_URL=...
#   fly deploy
#
# ENVIRONMENT stays "production" here on purpose: it switches OFF /auth/dev/*,
# so a public URL can't be used to log in as anyone by name. The seeded accounts
# still sign in normally with their email + DEV_PASSWORD.

app = "favorly-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
