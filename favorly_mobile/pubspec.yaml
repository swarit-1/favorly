name: favorly_mobile
description: "Favorly — one neighbor's trip carries the whole building."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.4.0
  go_router: ^14.0.0
  riverpod: ^2.5.0
  flutter_riverpod: ^2.5.0
  freezed_annotation: ^2.4.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.5

flutter:
  uses-material-design: true

  # Figtree is the closest open typeface to Meta's Optimistic (OFL, bundled).
  # Caveat renders the handwritten list in the demo camera preview.
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree-ExtraBold.ttf
          weight: 800
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Medium.ttf
          weight: 500
