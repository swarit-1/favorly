# Deployment manifest for the Trellis agent + graph service on Vercel.
# Vercel builds with uv (needs a PEP 621 [project] table) and finds the ASGI
# app through [tool.vercel].entrypoint.
#
# Dependencies mirror requirements.txt, which stays the source of truth for
# local dev. Change both together.

[project]
name = "trellis-agent-service"
version = "0.1.0"
description = "Event log, grocery-favor graph, extraction, reciprocity tracking"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "asyncpg>=0.29.0",
  "networkx>=3.2",
  "openai>=1.30.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.0",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "api.index:app"
